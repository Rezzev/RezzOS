name: dbg

on:
  push:
    branches: [debug/mkinitrd]

jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rootfs-nesting

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison bc libssl-dev libelf-dev libncurses-dev wget tar bzip2 cpio gzip e2fsprogs fakeroot qemu-utils qemu-system-x86

      - uses: actions/cache@v4
        with:
          path: dl_cache
          key: rezzos-dl-${{ hashFiles('build.sh') }}
          restore-keys: rezzos-dl-
      - uses: actions/cache@v4
        with:
          path: bzImage
          key: rezzos-bzImage-${{ hashFiles('build.sh') }}

      - name: Build
        run: chmod +x build.sh && ./build.sh > b.log 2>&1 || { tail -40 b.log; exit 1; }

      - name: Trace rezz-mkinitrd inside a booted guest
        run: |
          mkdir -p ov/etc/sv/dbg ov/etc/runit/runsvdir/default
          cat > ov/etc/sv/dbg/run <<'P'
          #!/bin/sh
          exec >/dev/console 2>&1
          sleep 8
          echo "DBG file exists: $(ls -la /usr/bin/rezz-mkinitrd 2>&1)"
          echo "DBG first line: $(head -1 /usr/bin/rezz-mkinitrd | od -c | head -1)"
          echo "DBG cpio -o supported:"
          echo hi > /tmp/hi; ( cd /tmp && echo ./hi | cpio -o -H newc > /tmp/t.cpio ) 2>&1 | sed 's/^/DBG   /'
          echo "DBG   cpio rc=$? size=$(wc -c < /tmp/t.cpio 2>/dev/null)"
          mkdir -p /mnt/disk/out
          echo "DBG ---- trace ----"
          sh -x /usr/bin/rezz-mkinitrd /mnt/disk/out/new.cpio.gz 2>&1 | head -70 | sed 's/^/DBG /'
          echo "DBG ---- end, rc above ----"
          echo "DBG DONE"
          poweroff -f
          P
          chmod +x ov/etc/sv/dbg/run
          ln -sf /etc/sv/dbg ov/etc/runit/runsvdir/default/dbg
          ( cd ov && find . -mindepth 1 | cpio -o -H newc --owner 0:0 --quiet ) | gzip -9 > ov.cpio.gz
          cat rootfs.cpio.gz ov.cpio.gz > t.cpio.gz
          timeout 300 qemu-system-x86_64 -kernel bzImage -initrd t.cpio.gz -append "console=ttyS0 random.trust_cpu=on" -drive file=disk.img,format=raw,if=virtio -m 1024M -display none -no-reboot -serial file:s.log || true
          tr -d '\r' < s.log | grep "^DBG" || { echo "no trace"; tail -30 s.log; }
