name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel + rootfs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc \
            libssl-dev libelf-dev libncurses-dev \
            wget tar bzip2 cpio gzip \
            e2fsprogs fakeroot \
            qemu-utils qemu-system-x86

      # build.sh keeps every downloaded tarball/apk in ./dl_cache, so caching it
      # turns a rerun from ~10 minutes of downloads into a few seconds.
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl_cache
          key: rezzos-dl-${{ hashFiles('build.sh') }}
          restore-keys: rezzos-dl-

      # build.sh reuses an existing ./bzImage unless FORCE_REBUILD_KERNEL=1.
      # The kernel config is kernel.config plus the inline KCONF block in
      # build.sh, so hashing both files is the right key.
      - name: Cache compiled kernel
        uses: actions/cache@v4
        with:
          path: bzImage
          key: rezzos-bzImage-${{ hashFiles('build.sh', 'kernel.config') }}

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build the check overlay
        run: |
          # The checks run inside the guest as an ordinary runit service, so
          # they see the system exactly as init leaves it.
          #
          # Rather than unpack and repack rootfs.cpio.gz, which would need
          # fakeroot again to keep ownership, the service is shipped as a
          # second cpio archive concatenated onto the first. The kernel reads
          # initramfs archives in sequence and later ones overlay earlier ones,
          # so nothing in the real rootfs is touched or rebuilt.
          mkdir -p overlay/etc/sv/citest overlay/etc/runit/runsvdir/default

          cat > overlay/etc/sv/citest/run <<'CITEST'
          #!/bin/sh
          # CI only. Not part of the image, injected by .github/workflows.
          exec >/dev/console 2>&1

          # runsvdir starts every service at once, so give the rest of them a
          # moment to configure their interfaces and mounts before looking.
          sleep 8

          check() {
              if eval "$2" >/dev/null 2>&1; then
                  echo "CITEST PASS $1"
              else
                  echo "CITEST FAIL $1"
              fi
          }

          check supervisor-running  'pidof runsvdir'
          check sv-responds         'SVDIR=/etc/runit/runsvdir/default sv status syslogd'
          check eth0-has-address    'ifconfig eth0 | grep -q "inet "'
          check resolver-configured 'grep -q "^nameserver" /etc/resolv.conf'
          check disk-mounted        'grep -q " /mnt/disk " /proc/mounts'
          check disk-writable       'touch /mnt/disk/.citest && rm -f /mnt/disk/.citest'
          check bash-runs           'bash -c "exit 0"'
          check pkg-present         'test -x /usr/bin/pkg'
          check dropbear-running    'pidof dropbear'

          # rezzusb against the second virtio drive (stick.img, whole-disk
          # ext4, no partition table) that the workflow attaches as /dev/vdb.
          check rezzusb-list-sees-vdb       'rezzusb list | grep -q "^vdb"'
          check rezzusb-fsck-refuses-mounted 'rezzusb mount vdb && ! rezzusb fsck vdb'
          check rezzusb-umount              'rezzusb umount vdb'

          # Services have no controlling terminal, and plain e2fsck refuses
          # to run without one ("need terminal for interactive repairs") -
          # observed even immediately after a preen pass reported clean.
          # So both passes use preen: the first may apply safe repairs
          # (exit 1), the second asserts a perfectly clean result and
          # still goes red on a genuinely broken filesystem.
          rezzusb fsck vdb -p || echo "(preen applied repairs)"
          if fsck_out=$(rezzusb fsck vdb -p 2>&1); then
              echo "CITEST PASS rezzusb-fsck-clean"
          else
              echo "CITEST FAIL rezzusb-fsck-clean"
              echo "$fsck_out"
          fi

          echo "CITEST DONE"

          # Print once. runsv would restart this script the moment it exits.
          exec sleep 3600
          CITEST

          chmod +x overlay/etc/sv/citest/run
          ln -sf /etc/sv/citest overlay/etc/runit/runsvdir/default/citest

          ( cd overlay && find . -mindepth 1 | cpio -o -H newc --owner 0:0 --quiet ) \
            | gzip -9 > overlay.cpio.gz
          cat rootfs.cpio.gz overlay.cpio.gz > rootfs-test.cpio.gz

      - name: Build the test USB stick image
        run: |
          # Whole-disk ext4, no partition table: appears in the guest as
          # /dev/vdb and exercises rezzusb list/mount/fsck without sfdisk.
          truncate -s 64M stick.img
          mke2fs -F -t ext4 -L CITEST stick.img

      - name: Boot smoke test
        run: |
          # TCG only - hosted runners give no reliable /dev/kvm.
          # QEMU never exits on its own here, so `timeout` ending it is expected.
          #
          # The guest must hold the initramfs AND its unpacked root at once.
          # The image outgrew 1024M: run #76 (green) shipped a 126 MB artifact,
          # run #86 (failing) 194 MB five days later, and the unpack started
          # dying with "Initramfs unpacking failed: write error" before any
          # in-guest check could run. 2048M matches what start-gui.sh already
          # assumes. The timeout gets the same headroom against further image
          # growth: under TCG the boot window shrinks as the image grows.
          timeout 300 qemu-system-x86_64 \
            -kernel bzImage \
            -initrd rootfs-test.cpio.gz \
            -append "console=ttyS0 random.trust_cpu=on" \
            -drive file=disk.img,format=raw,if=virtio \
            -drive file=stick.img,format=raw,if=virtio \
            -netdev user,id=net0 -device virtio-net,netdev=net0 \
            -m 2048M -display none -no-reboot \
            -serial file:serial.log || true

          echo "--------- serial output ---------"
          cat serial.log || true
          echo "---------------------------------"

          # Deliberately not pinned to a version string, so bumping the kernel
          # in build.sh does not silently break this check.
          if ! grep -q "Linux version" serial.log; then
            echo "::error::Kernel never announced itself on the serial console."
            exit 1
          fi

          # init silences the console with `echo 0 > /proc/sys/kernel/printk`,
          # so a clean boot is quiet. Only a panic is a hard failure.
          if grep -qE "Kernel panic|Attempted to kill init|not syncing" serial.log; then
            echo "::error::Kernel panic during boot."
            exit 1
          fi

          # The guest writes to a tty, so every line arrives with a CR on it.
          tr -d '\r' < serial.log > serial.clean

          if ! grep -q "^CITEST DONE" serial.clean; then
            echo "::error::The in-guest checks never finished. Either init did not reach runsvdir, or a service wedged before the checks ran."
            exit 1
          fi

          echo "--------- in-guest checks ---------"
          grep "^CITEST " serial.clean
          echo "-----------------------------------"

          if grep -q "^CITEST FAIL" serial.clean; then
            grep "^CITEST FAIL" serial.clean | while read -r _ _ name; do
              echo "::error::in-guest check failed: $name"
            done
            exit 1
          fi

          echo "Boot smoke test passed."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezzos-build
          # disk.img is an empty 1G ext4 image regenerated by build.sh - not worth uploading.
          path: |
            bzImage
            rootfs.cpio.gz
            serial.log
          if-no-files-found: warn
          retention-days: 14
