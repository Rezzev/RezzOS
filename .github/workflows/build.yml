name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel + rootfs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc \
            libssl-dev libelf-dev libncurses-dev \
            wget tar bzip2 cpio gzip \
            e2fsprogs fakeroot \
            qemu-utils qemu-system-x86

      # build.sh keeps every downloaded tarball/apk in ./dl_cache, so caching it
      # turns a rerun from ~10 minutes of downloads into a few seconds.
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl_cache
          key: rezzos-dl-${{ hashFiles('build.sh') }}
          restore-keys: rezzos-dl-

      # build.sh reuses an existing ./bzImage unless FORCE_REBUILD_KERNEL=1.
      # The kernel config lives inline in build.sh, so its hash is the right key.
      - name: Cache compiled kernel
        uses: actions/cache@v4
        with:
          path: bzImage
          key: rezzos-bzImage-${{ hashFiles('build.sh') }}

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Boot smoke test
        run: |
          # TCG only - hosted runners give no reliable /dev/kvm.
          # QEMU never exits on its own here, so `timeout` ending it is expected.
          timeout 180 qemu-system-x86_64 \
            -kernel bzImage \
            -initrd rootfs.cpio.gz \
            -append "console=ttyS0 random.trust_cpu=on" \
            -drive file=disk.img,format=raw,if=virtio \
            -netdev user,id=net0 -device virtio-net,netdev=net0 \
            -m 1024M -display none -no-reboot \
            -serial file:serial.log || true

          echo "--------- serial output ---------"
          cat serial.log || true
          echo "---------------------------------"

          # Deliberately not pinned to a version string, so bumping the kernel
          # in build.sh does not silently break this check.
          if ! grep -q "Linux version" serial.log; then
            echo "::error::Kernel never announced itself on the serial console."
            exit 1
          fi

          # init silences the console with `echo 0 > /proc/sys/kernel/printk`,
          # so a clean boot is quiet. Only a panic is a hard failure.
          if grep -qE "Kernel panic|Attempted to kill init|not syncing" serial.log; then
            echo "::error::Kernel panic during boot."
            exit 1
          fi

          echo "Boot smoke test passed."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rezzos-build
          # disk.img is an empty 1G ext4 image regenerated by build.sh - not worth uploading.
          path: |
            bzImage
            rootfs.cpio.gz
            serial.log
          if-no-files-found: warn
          retention-days: 14
