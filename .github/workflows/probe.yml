name: probe

on:
  push:
    branches: [experiment/check-setconsolefont]

jobs:
  modes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libelf-dev libncurses-dev \
            wget tar bzip2 cpio gzip e2fsprogs fakeroot qemu-utils qemu-system-x86

      - uses: actions/cache@v4
        with: { path: dl_cache, key: 'rezzos-dl-${{ hashFiles(''build.sh'') }}', restore-keys: rezzos-dl- }
      - uses: actions/cache@v4
        with: { path: bzImage, key: 'rezzos-bzImage-${{ hashFiles(''build.sh'') }}' }

      - name: Build
        run: chmod +x build.sh && ./build.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }

      - name: Modes in the packed rootfs
        run: |
          cd busybox-1.36.1/_install/usr/bin
          echo "=== RezzOS tools, as they will ship ==="
          for f in pkg rsv font swap systemctl rezzconfig rezzmon help poweroff reboot shutdown hibernate suspend halt fetch; do
            [ -e "$f" ] || { printf '%-14s ABSENT\n' "$f"; continue; }
            printf '%-14s %s %s\n' "$f" "$(stat -c%A "$f")" "$([ -x "$f" ] && echo EXECUTABLE || echo 'NOT EXECUTABLE')"
          done

      - name: Boot and actually try to run them
        run: |
          mkdir -p ov/etc/sv/t ov/etc/runit/runsvdir/default
          cat > ov/etc/sv/t/run <<'P'
          #!/bin/sh
          exec >/dev/console 2>&1
          sleep 8
          for c in rsv font swap systemctl rezzmon help pkg; do
            if [ -x "/usr/bin/$c" ]; then
              echo "MODE $c executable"
            else
              echo "MODE $c NOT-EXECUTABLE"
            fi
          done
          echo "--- trying to run them the way a user would ---"
          rsv list      >/dev/null 2>&1 && echo "RUN rsv ok"       || echo "RUN rsv FAILED rc=$?"
          font current  >/dev/null 2>&1 && echo "RUN font ok"      || echo "RUN font FAILED rc=$?"
          swap status   >/dev/null 2>&1 && echo "RUN swap ok"      || echo "RUN swap FAILED rc=$?"
          systemctl status syslogd >/dev/null 2>&1 && echo "RUN systemctl ok" || echo "RUN systemctl FAILED rc=$?"
          help          >/dev/null 2>&1 && echo "RUN help ok"      || echo "RUN help FAILED rc=$?"
          echo "MODE DONE"
          exec sleep 3600
          P
          chmod +x ov/etc/sv/t/run
          ln -sf /etc/sv/t ov/etc/runit/runsvdir/default/t
          ( cd ov && find . -mindepth 1 | cpio -o -H newc --owner 0:0 --quiet ) | gzip -9 > ov.cpio.gz
          cat rootfs.cpio.gz ov.cpio.gz > t.cpio.gz

          timeout 240 qemu-system-x86_64 \
            -kernel bzImage -initrd t.cpio.gz \
            -append "console=ttyS0 random.trust_cpu=on" \
            -drive file=disk.img,format=raw,if=virtio \
            -m 1024M -display none -no-reboot -serial file:s.log || true
          tr -d '\r' < s.log > s.txt
          echo "=========== IN A BOOTED SYSTEM ==========="
          grep -E "^MODE|^RUN" s.txt || { echo "no report"; tail -20 s.txt; }
