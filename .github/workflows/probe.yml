name: probe

on:
  push:
    branches: [experiment/check-setconsolefont]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/serial-console-login

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc libssl-dev libelf-dev libncurses-dev \
            wget tar bzip2 cpio gzip e2fsprogs fakeroot qemu-utils qemu-system-x86

      - uses: actions/cache@v4
        with:
          path: dl_cache
          key: rezzos-dl-${{ hashFiles('build.sh') }}
          restore-keys: rezzos-dl-

      - uses: actions/cache@v4
        with:
          path: bzImage
          key: rezzos-bzImage-${{ hashFiles('build.sh') }}

      - name: Build
        run: chmod +x build.sh && ./build.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }

      - name: Add a reporter service
        run: |
          mkdir -p ov/etc/sv/probe ov/etc/runit/runsvdir/default
          cat > ov/etc/sv/probe/run <<'P'
          #!/bin/sh
          exec >/dev/console 2>&1
          sleep 10
          echo "PROBE consoles: $(tr '\n' '|' < /proc/consoles)"
          echo "PROBE ttyS0 service state: $(SVDIR=/etc/runit/runsvdir/default sv status ttyS0 2>&1)"
          for t in cpio gzip find; do
            command -v "$t" >/dev/null 2>&1 && echo "PROBE has $t" || echo "PROBE MISSING $t"
          done
          echo "PROBE getty processes:"
          ps 2>/dev/null | grep -c '[g]etty' | sed 's/^/PROBE getty count: /'
          echo "PROBE DONE"
          exec sleep 3600
          P
          chmod +x ov/etc/sv/probe/run
          ln -sf /etc/sv/probe ov/etc/runit/runsvdir/default/probe
          ( cd ov && find . -mindepth 1 | cpio -o -H newc --owner 0:0 --quiet ) | gzip -9 > ov.cpio.gz
          cat rootfs.cpio.gz ov.cpio.gz > test.cpio.gz

      - name: Boot exactly like start.sh does
        run: |
          timeout 200 qemu-system-x86_64 \
            -kernel bzImage -initrd test.cpio.gz \
            -append "console=ttyS0 random.trust_cpu=on" \
            -drive file=disk.img,format=raw,if=virtio \
            -netdev user,id=net0 -device virtio-net,netdev=net0 \
            -m 1024M -display none -no-reboot -serial file:serial.log || true

          tr -d '\r' < serial.log > s.txt
          echo "=========== PROBE OUTPUT ==========="
          grep "^PROBE" s.txt || echo "(probe never reported)"
          echo "=========== LOGIN PROMPT ==========="
          if grep -qi "login:" s.txt; then
            echo "YES - a login prompt appeared on the serial console:"
            grep -i "login:" s.txt | head -3
          else
            echo "NO - still no login prompt on serial"
          fi
          echo "=========== TAIL ==========="
          tail -25 s.txt
