name: probe

on:
  push:
    branches: [experiment/check-setconsolefont]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/setconsolefont-links-against-musl

      - name: Does the fixed line produce a runnable binary
        run: |
          gcc -O2 -static usr/bin/setconsolefont.c -o /tmp/scf
          printf 'result: '; file -b /tmp/scf | cut -c1-90
          echo "interpreter section:"
          readelf -l /tmp/scf | grep -c INTERP || echo "  none, as intended"
          echo "dynamic NEEDED entries:"
          readelf -d /tmp/scf 2>/dev/null | grep -c NEEDED || echo "  none, as intended"
          echo
          echo "it runs and reports usage on no args:"
          /tmp/scf; echo "  exit=$? (1 expected)"
          echo "and it does not crash when given a font name off-console:"
          /tmp/scf TER16x32; echo "  exit=$? (1 expected here, no tty0 in a container)"
          echo
          echo "committed binary still in the tree?"
          test -e usr/bin/setconsolefont && echo "  yes, still there" || echo "  no, removed"
