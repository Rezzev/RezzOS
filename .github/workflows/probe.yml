name: probe

on:
  push:
    branches: [experiment/check-setconsolefont]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What does build.sh's gcc line actually produce
        run: |
          echo "=== committed binaries in usr/bin ==="
          for f in usr/bin/setconsolefont usr/bin/rezzfetch usr/bin/swap-offset; do
            printf '%-26s ' "$f"
            file -b "$f" | cut -c1-110
          done

          echo
          echo "=== build.sh line 258, reproduced exactly ==="
          gcc -O2 usr/bin/setconsolefont.c -o /tmp/scf
          printf 'compiled output: '; file -b /tmp/scf | cut -c1-110
          echo "interpreter it will ask the kernel for:"
          readelf -l /tmp/scf | grep -A1 INTERP | tail -1
          echo "shared libraries it needs:"
          readelf -d /tmp/scf | grep NEEDED

          echo
          echo "=== does a musl-only rootfs have that loader? ==="
          echo "RezzOS ships /lib/ld-musl-x86_64.so.1 (from musl-1.2.5-r3.apk)"
          echo "and no glibc package appears anywhere in build.sh:"
          grep -c 'glibc\|gcompat' build.sh || echo "0 matches"
