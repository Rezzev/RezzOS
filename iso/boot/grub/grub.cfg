serial --unit=0 --speed=115200
terminal_input console serial

# Загружаем модули для графики самого GRUB
insmod vbe
insmod vga
insmod gfxterm

set gfxmode=1920x1080
terminal_output gfxterm serial

set color_normal=light-gray/black
set color_highlight=white/dark-gray
set timeout=5

menuentry "RezzOS (VESA Graphics)" {
    set gfxpayload=keep
    linux /boot/bzImage root=/dev/ram0 rw nomodeset quiet
    initrd /boot/rootfs.cpio.gz
}


menuentry "RezzOS ttyS0 (qemu port)" {
    set gfxpayload=text
    linux /boot/vmlinuz root=/dev/ram0 rw nomodeset quiet console=ttyS0
    initrd /boot/rootfs.cpio.gz
}
