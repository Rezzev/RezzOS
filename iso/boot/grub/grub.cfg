# Show the menu on the screen and on the first serial port at the same time.
#
# The second entry below exists for people booting over a COM port or in QEMU
# with -nographic, but without this the menu itself only ever went to the
# screen, so on a serial console you saw nothing and could not select it.
#
# `terminal_input console serial` accepts keystrokes from both, so this does
# not take the keyboard away from anyone booting normally. On a machine with
# no serial port the serial commands fail harmlessly and the screen is used.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

set timeout=5
menuentry "RezzOS" {
    linux /boot/bzImage quiet console=tty0 loglevel=0 nokaslr nomodeset
    initrd /boot/rootfs.cpio.gz
}
menuentry "RezzOS ttyS0(for COM port, qemu)" {
    linux /boot/bzImage quiet console=ttyS0 loglevel=0 nokaslr nomodeset
    initrd /boot/rootfs.cpio.gz
}
