# Включаем последовательный порт, но не делаем его единственным
serial --unit=0 --speed=115200
terminal_input console serial

# Загружаем модули для графического меню GRUB
insmod vbe
insmod vga
insmod gfxterm
insmod png
insmod jpeg

# Устанавливаем VESA-разрешение для меню GRUB и дублируем вывод
# на экран (gfxterm) и в COM-порт (serial)
set gfxmode=1920x1080
terminal_output gfxterm serial

set color_normal=light-gray/black
set color_highlight=white/dark-gray

set timeout=5

menuentry "RezzOS (VESA Graphics)" {
    # Для разрешения 1920x1080 лучше использовать gfxpayload, 
    # чтобы ядро наследовало видеорежим, заданный в GRUB
    set gfxpayload=keep
    linux /boot/vmlinuz root=/dev/ram0 rw nomodeset video=efifb:off video=vesafb:mtrr:3,ywrap
    initrd /boot/rootfs.cpio.gz
}

menuentry "RezzOS ttyS0 (for COM port" {
    set gfxpayload=text
    linux /boot/vmlinuz root=/dev/ram0 rw quiet console=ttyS0 loglevel=7 nokaslr nomodeset
    initrd /boot/rootfs.cpio.gz
}
