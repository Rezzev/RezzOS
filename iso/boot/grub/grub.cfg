serial --unit=0 --speed=115200
terminal_input console serial

insmod vbe
insmod vga
insmod gfxterm

# Включаем 1080p для меню GRUB и передаем его ядру
set gfxmode=1920x1080
terminal_output gfxterm serial

set color_normal=light-gray/black
set color_highlight=white/dark-gray
set timeout=5

menuentry "RezzOS (1920x1080 Graphics)" {
    set gfxpayload=keep
    linux /boot/bzImage root=/dev/ram0 rw nomodeset console=ttyS0,115200 console=tty0 ignore_loglevel
    initrd /boot/rootfs.cpio.gz
}

menuentry "RezzOS (Serial Debug)" {
    set gfxpayload=text
    linux /boot/bzImage root=/dev/ram0 rw nomodeset console=ttyS0,115200 ignore_loglevel
    initrd /boot/rootfs.cpio.gz
}
